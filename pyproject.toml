[project]
name = "claude-seo-master"
version = "3.0.0"
description = "Claude SEO Master Skills: five open-source SEO skill packs merged into one Claude Code plugin, with PDF reports and AI fix prompts"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
authors = [
  {name = "ankushpanday33"},
  {name = "Daniel Agrici"},
  {name = "Bhanu Namikaze"},
  {name = "Zubair Trabzada"},
  {name = "Ryze AI"},
  {name = "leopard627"}
]
keywords = ["seo", "claude-code", "ai-tools", "schema-markup", "e-e-a-t", "geo"]

[project.urls]
Homepage = "https://github.com/ankushpanday33/Claude-Seo-Master-Skills"
Repository = "https://github.com/ankushpanday33/Claude-Seo-Master-Skills"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "F401", "F541", "E741", "E701", "F841", "I001", "E402", "W293"]

[tool.pytest.ini_options]
addopts = "-ra --ignore=tests/test_manifest_consistency.py"
